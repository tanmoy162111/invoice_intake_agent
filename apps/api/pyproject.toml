[project]
name = "intake"
version = "0.1.0"
description = "Invoice Intake Agent API and worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "cryptography>=50.0.1",
  "pdfplumber>=0.11.10",
  "python-multipart>=0.0.32",
  "pypdfium2>=5.13.0",
  "pillow>=12.3.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]
generator = [
    "numpy>=2.5.3",
    "rapidfuzz>=3.14.6",
    "reportlab>=5.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intake"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Data tables and closures that run immediately; readability over line length here.
"../../data/generator/*.py" = ["E501", "B023"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src/intake"]

[[tool.mypy.overrides]]
module = ["pypdfium2", "pdfplumber"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "intake.core.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../data"]
